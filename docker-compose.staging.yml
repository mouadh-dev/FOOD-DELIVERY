version: '3.8'

networks:
  food-delivery-network:
    driver: bridge

services:
  mongodb:
    image: mongo:latest
    container_name: food-delivery-mongodb-staging
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: food-delivery-staging
    volumes:
      - mongo_data_staging:/data/db
    networks:
      - food-delivery-network
    ports:
      - "27018:27017"

  backend:
    image: ${DOCKER_REGISTRY:-localhost}/${IMAGE_NAME:-food-delivery}-backend:${GIT_COMMIT_SHORT:-latest}
    container_name: food-delivery-backend-staging
    restart: unless-stopped
    ports:
      - "4001:4000"
    environment:
      NODE_ENV: staging
      MONGO_URL: mongodb://mongodb:27017/food-delivery-staging
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-staging-secret-key}
      SALT: ${SALT:-10}
    depends_on:
      - mongodb
    networks:
      - food-delivery-network
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    image: ${DOCKER_REGISTRY:-localhost}/${IMAGE_NAME:-food-delivery}-frontend:${GIT_COMMIT_SHORT:-latest}
    container_name: food-delivery-frontend-staging
    restart: unless-stopped
    ports:
      - "3001:80"
    environment:
      NODE_ENV: staging
      VITE_BACKEND_URL: http://localhost:4001
    depends_on:
      - backend
    networks:
      - food-delivery-network

  admin:
    image: ${DOCKER_REGISTRY:-localhost}/${IMAGE_NAME:-food-delivery}-admin:${GIT_COMMIT_SHORT:-latest}
    container_name: food-delivery-admin-staging
    restart: unless-stopped
    ports:
      - "3002:80"
    environment:
      NODE_ENV: staging
      VITE_BACKEND_URL: http://localhost:4001
    depends_on:
      - backend
    networks:
      - food-delivery-network

volumes:
  mongo_data_staging:
